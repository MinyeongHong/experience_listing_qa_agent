[project]
name = "experience-listing-qa-agent"
version = "0.1.0"
description = "AI-powered QA agent for experience listings"
readme = "README.md"
authors = [
    { name = "MinyeongHong", email = "78523467+MinyeongHong@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.128.8",
    "google-genai>=2.25.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.16.8",
]


[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests requiring a real database",
]
[tool.ruff]
exclude = ["notebooks"]
